<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
    <h2>Wanna Get In Touch?</h2>
            <form action="/submit-form" method="post">
                <p>
                    <label for="fullname">Full Name:</label><br>
                    <input type="text" id="fullname" name="fullname">
                </p>
                <p>
                    <label for="useremail">Email Address:</label><br>
                    <input type="text" id="useremail" name="useremail">
                </p>
                <p>
                    <label for="phone">Phone Number:</label><br>
                    <input type="text" id="phone" name="phone">
                </p>
                <p>
                    <label for="age">Age</label><br>
                    <input type="number" id="age" name="age">
                </p>
                <p>
                    <label for="birthdate">Birth Date:</label><br>
                    <input type="date" id="birthdate" name="birthdate">
                </p>
                <p>
                    <label for="message">Leave a message!:</label><br>
                    <textarea id="message" name="message" rows="5" cols="30">Type your message here...</textarea>
                </p>
                <p>
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </p>
            </form>
    <footer>
        <p><a href="index.html">Back to Home</a></p>
        <p>&copy; 2026 Personal Page</p>
    </footer>
</body>
</html>
